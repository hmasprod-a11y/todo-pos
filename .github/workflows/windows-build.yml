name: Windows build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Core regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Tk interface smoke test
        run: python -B tests/ui_smoke.py
      - name: Purchase to printable receipt through Tk controls
        run: python -B tests/ui_acceptance.py
      - name: Integrated families and statistics through Tk controls
        run: python -B tests/ui_integration.py
      - name: Compile sources
        run: python -m compileall -q todo ToDo.pyw IMPORT_OLD_DATA.pyw
      - name: Build portable Windows application
        shell: cmd
        run: pyinstaller --noconfirm --clean --windowed --onedir --name ToDo --paths todo --add-data "todo;todo" ToDo.pyw
      - name: Build data import utility
        shell: cmd
        run: pyinstaller --noconfirm --clean --windowed --onefile --name ImporterToDo --paths todo IMPORT_OLD_DATA.pyw
      - name: Create optional isolated demo
        run: python tools/create_demo.py dist/ToDo
      - name: Include documentation and importer
        shell: pwsh
        run: |
          Copy-Item dist/ImporterToDo.exe dist/ToDo/ImporterToDo.exe
          New-Item -ItemType Directory -Force -Path dist/ToDo/docs | Out-Null
          Copy-Item README.md,README_1_1_AR.md,VALIDATION.md,CHANGELOG.md dist/ToDo/
          Copy-Item docs/* dist/ToDo/docs/
          @(
            "Commit=$env:GITHUB_SHA",
            "WindowsBuildRun=$env:GITHUB_RUN_NUMBER",
            "Workflow=$env:GITHUB_WORKFLOW"
          ) | Set-Content dist/ToDo/RELEASE_HEAD.txt -Encoding UTF8
          $required = @(
            "dist/ToDo/README.md",
            "dist/ToDo/README_1_1_AR.md",
            "dist/ToDo/VALIDATION.md",
            "dist/ToDo/CHANGELOG.md",
            "dist/ToDo/RELEASE_HEAD.txt",
            "dist/ToDo/docs/USER_GUIDE_FR.md",
            "dist/ToDo/docs/USER_GUIDE_AR.md",
            "dist/ToDo/docs/BACKUP_RESTORE.md",
            "dist/ToDo/docs/INSTALLATION_WINDOWS.md",
            "dist/ToDo/docs/TECHNICAL_ARCHITECTURE.md",
            "dist/ToDo/docs/RELEASE_CHECKLIST.md"
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing release document: $file" } }
      - name: Build Windows installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Smoke test installed Windows setup
        shell: pwsh
        run: |
          $setup = Resolve-Path "dist/ToDo-POS-1.1.0-Setup.exe"
          $proc = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with exit code $($proc.ExitCode)" }

          $installDir = Join-Path $env:ProgramFiles "ToDo POS"
          $exe = Join-Path $installDir "ToDo.exe"
          if (-not (Test-Path $exe)) { throw "Installed ToDo.exe not found at $exe" }

          $dataDir = Join-Path $env:ProgramData "ToDo POS"
          if (-not (Test-Path $dataDir)) { throw "ProgramData directory was not created: $dataDir" }

          # Verify the installer grants Modify to the built-in Users group,
          # independently of the elevated GitHub runner account.
          $usersSid = New-Object System.Security.Principal.SecurityIdentifier("S-1-5-32-545")
          $hasModify = $false
          foreach ($rule in (Get-Acl $dataDir).Access) {
            try { $sid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]) }
            catch { continue }
            $modify = [System.Security.AccessControl.FileSystemRights]::Modify
            if ($sid -eq $usersSid -and
                $rule.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
                (($rule.FileSystemRights -band $modify) -eq $modify)) {
              $hasModify = $true
              break
            }
          }
          if (-not $hasModify) { throw "Built-in Users group does not have Modify permission on $dataDir" }

          $probe = Join-Path $dataDir "ci-write-probe.txt"
          "write-ok" | Set-Content -Path $probe -Encoding UTF8
          if ((Get-Content $probe -Raw).Trim() -ne "write-ok") { throw "ProgramData write probe failed" }

          # First-launch smoke of the installed frozen executable.
          # A successful startup must create the live SQLite database under ProgramData,
          # never next to the executable in Program Files.
          $dbPath = Join-Path $dataDir "data\todo.db"
          $launchError = Join-Path $dataDir "logs\launch_error.txt"
          if (Test-Path $dbPath) { Remove-Item $dbPath -Force }
          if (Test-Path $launchError) { Remove-Item $launchError -Force }

          $appProc = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $dbPath)) {
            if ($appProc.HasExited) {
              throw "Installed ToDo.exe exited before creating ProgramData database (exit $($appProc.ExitCode))"
            }
            Start-Sleep -Milliseconds 500
            $appProc.Refresh()
          }
          if (-not (Test-Path $dbPath)) {
            if (-not $appProc.HasExited) { Stop-Process -Id $appProc.Id -Force }
            throw "Installed ToDo.exe did not create $dbPath"
          }
          if (Test-Path $launchError) {
            $detail = Get-Content $launchError -Raw
            if (-not $appProc.HasExited) { Stop-Process -Id $appProc.Id -Force }
            throw "Installed ToDo.exe wrote launch_error.txt: $detail"
          }
          if (-not $appProc.HasExited) { Stop-Process -Id $appProc.Id -Force }
          if (Test-Path (Join-Path $installDir "todo\data\todo.db")) {
            throw "Installed application wrote mutable database inside Program Files"
          }

          $sentinel = Join-Path $dataDir "ci-uninstall-preserve.txt"
          "keep-me" | Set-Content -Path $sentinel -Encoding UTF8
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found: $uninstaller" }
          $un = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($un.ExitCode)" }
          if (Test-Path $exe) { throw "Application executable still present after uninstall" }
          if (-not (Test-Path $sentinel)) { throw "ProgramData was removed by uninstall" }

      - name: Create Windows ZIP package
        shell: pwsh
        run: Compress-Archive -Path dist/ToDo/* -DestinationPath dist/ToDo-POS-1.1.0-Windows.zip -Force
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-FileHash dist/ToDo-POS-1.1.0-Windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  ToDo-POS-1.1.0-Windows.zip" } | Set-Content dist/SHA256SUMS.txt
          Get-FileHash dist/ToDo-POS-1.1.0-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  ToDo-POS-1.1.0-Setup.exe" } | Add-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ToDo-POS-1.1.0-Windows
          path: |
            dist/ToDo
            dist/ToDo-POS-1.1.0-Windows.zip
            dist/ToDo-POS-1.1.0-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
